[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-workbench"
version = "0.1.0"
description = "A lightweight desktop application for exploring and working with SQLite databases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Carlos Costa" }
]
keywords = ["sqlite", "database", "desktop", "python", "customtkinter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: User Interfaces"
]
dependencies = [
  "customtkinter",
  "pygments"
]

[tool.setuptools]
py-modules = ["app", "database", "localization"]